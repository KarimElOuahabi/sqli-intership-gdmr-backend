events {}

http {
    upstream gdmr_backend_pool {
        server backend1:8080;
        server backend2:8080;
    }

    server {
        listen 80;

        # SSE stream: needs buffering off and a long read timeout, otherwise nginx
        # buffers the response and/or kills the connection before the browser's
        # EventSource ever sees an event.
        location /api/notifications/stream {
            proxy_pass http://gdmr_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location / {
            proxy_pass http://gdmr_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}
