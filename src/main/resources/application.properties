spring.application.name=gdmr-backend

# --- Database (Postgres via Docker) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/gdmr_db}
spring.datasource.username=${DB_USERNAME:gdmr_user}
spring.datasource.password=${DB_PASSWORD:gdmr_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate = Hibernate checks entities match the DB schema, but never creates/alters tables itself
# Flyway owns the schema — this is intentional and important to keep this way
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Redis (pub/sub for cross-instance SSE notification delivery) ---
# Only needed once this app runs as more than one instance — set NOTIFICATIONS_REDIS_ENABLED=false
# for a single-instance deployment to skip Redis entirely (no connection attempted, no cost).
# Password and SSL are blank/off for local Docker Redis; Azure Cache for Redis
# requires both (password from its access keys, TLS on port 6380).
app.notifications.redis-enabled=${NOTIFICATIONS_REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
    spring.flyway.validate-on-migrate=false

# --- JWT ---
# In production, set JWT_SECRET to a long random value via an environment variable —
# never commit the real signing secret.
app.jwt.secret=${JWT_SECRET:abc369c7-bdb5-4157-ae81-22a10a38d5aa}
app.jwt.expiration-ms=900000
app.cookie.secure=${COOKIE_SECURE:false}

# --- Storage ---
app.file-storage.base-path=./uploads

# --- Uploads (documents, profile pictures) — Spring's 1MB default is too low ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

